name: Application verification and builds
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wpalt
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wpalt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wpalt"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://wpalt:ci-only-password@localhost:5432/wpalt
      WPALT_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: python3 scripts/check_protocols.py
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo install cargo-audit --locked --version 0.22.2 --root work/tooling
      - run: python3 scripts/audit_dependencies.py --audit-binary work/tooling/bin/cargo-audit
      - run: cargo build --release --locked
      - run: python3 scripts/cli_acceptance.py --binary target/release/wpalt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm install --prefix work/browser playwright@1.62.1
      - run: work/browser/node_modules/.bin/playwright install --with-deps chromium
      - run: WPALT_BINARY="$PWD/target/release/wpalt" PLAYWRIGHT_MODULE="$PWD/work/browser/node_modules/playwright" node scripts/browser_acceptance.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-review
          path: work/browser-evidence/*.png
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wpalt-linux-x86_64
          path: target/release/wpalt
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dependency-audit
          path: work/dependency-audit.json
  clean-build:
    needs: [application, compiler-floor]
    runs-on: ubuntu-24.04
    steps:
      - name: Select fresh build directories
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/wpalt-clean-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/wpalt-clean-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Verify fresh build directories
        run: |
          test ! -e "$CARGO_TARGET_DIR"
          test ! -e "$CARGO_HOME/registry"
      - name: Build merged source without restored caches
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Verify the clean executable through install and recovery
        run: python3 scripts/cli_acceptance.py --binary "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/wpalt"
      - name: Package source identity, executable and checksums
        run: python3 scripts/package_build.py --binary "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/wpalt" --target x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wpalt-clean-linux-x86_64-${{ github.sha }}
          path: |
            work/distribution/*.tar.gz
            work/distribution/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
  compiler-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.85.0
      - run: cargo check --locked
