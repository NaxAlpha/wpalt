name: Application verification and builds
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wpalt
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wpalt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wpalt"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://wpalt:ci-only-password@localhost:5432/wpalt
      WPALT_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: python3 scripts/check_protocols.py
      - run: python3 -m unittest discover -s tests/pipeline -v
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install optional native video fixture tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: cargo test --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: m3-volume-evidence
          path: work/m3-volume.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: m4-volume-evidence
          path: work/m4-volume.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: m5-volume-evidence
          path: work/m5-volume.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: m6-volume-evidence
          path: work/m6-volume.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: m7-privacy-volume-evidence
          path: work/m7-privacy-volume.json
  clean-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Select fresh build directories
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/wpalt-clean-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/wpalt-clean-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --ignore-scripts
      - run: npm --prefix frontend run build
      - run: git diff --exit-code -- assets/generated/
      - name: Verify encoder maintenance patch against original source
        run: python3 scripts/verify_encoder_vendor.py
      - name: Verify fresh build directories
        run: |
          test ! -e "$CARGO_TARGET_DIR"
          test ! -e "$CARGO_HOME/registry"
      - name: Build merged source without restored caches
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Verify the clean executable through install and recovery
        run: python3 scripts/cli_acceptance.py --binary "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/wpalt"
      - name: Verify fresh-target WordPress migration with the clean executable
        run: python3 scripts/migration_acceptance.py --binary "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/wpalt"
      - name: Package source identity, executable and checksums
        run: python3 scripts/package_build.py --binary "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/wpalt" --target x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wpalt-clean-linux-x86_64-${{ github.sha }}
          path: |
            work/distribution/*.tar.gz
            work/distribution/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
  compiler-floor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
      - run: cargo check --locked

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: audit-tool
        with:
          path: work/tooling
          key: audit-tool-${{ runner.os }}-${{ runner.arch }}-rust1.98.1-cargo-audit0.22.2
      - if: steps.audit-tool.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2 --root work/tooling
      - run: work/tooling/bin/cargo-audit --version | grep -Fx 'cargo-audit 0.22.2'
      - run: python3 scripts/audit_dependencies.py --audit-binary work/tooling/bin/cargo-audit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dependency-audit
          path: work/dependency-audit.json
  frontend:
    needs: clean-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --ignore-scripts
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend run build
      - run: git diff --exit-code -- assets/generated/
      - run: npm audit --prefix frontend --audit-level=high
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wpalt-clean-linux-x86_64-${{ github.sha }}
          path: work/distribution
      - run: python3 scripts/release_build.py --directory work/distribution --source "$GITHUB_SHA" --extract work/verified-build
      - run: frontend/node_modules/.bin/playwright install --with-deps chromium
      - run: WPALT_BINARY="$PWD/work/verified-build/wpalt" PLAYWRIGHT_MODULE="$PWD/frontend/node_modules/playwright" node scripts/browser_acceptance.cjs
      - run: WPALT_SCRIPTS_ONLY=1 WPALT_BINARY="$PWD/work/verified-build/wpalt" PLAYWRIGHT_MODULE="$PWD/frontend/node_modules/playwright" node scripts/browser_acceptance.cjs
      - run: WPALT_CLONE_ONLY=1 WPALT_BINARY="$PWD/work/verified-build/wpalt" PLAYWRIGHT_MODULE="$PWD/frontend/node_modules/playwright" node scripts/browser_acceptance.cjs
      - run: WPALT_SPAM_ONLY=1 WPALT_BINARY="$PWD/work/verified-build/wpalt" PLAYWRIGHT_MODULE="$PWD/frontend/node_modules/playwright" node scripts/browser_acceptance.cjs
      - name: Install optional local video fixture tools
        run: sudo apt-get install -y --no-install-recommends ffmpeg
      - run: WPALT_VIDEO_ONLY=1 WPALT_BINARY="$PWD/work/verified-build/wpalt" PLAYWRIGHT_MODULE="$PWD/frontend/node_modules/playwright" node scripts/browser_acceptance.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ui-review
          path: work/ui-review/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: browser-review
          path: work/browser-evidence/
  native-pitr:
    needs: clean-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wpalt-clean-linux-x86_64-${{ github.sha }}
          path: work/distribution
      - run: python3 scripts/release_build.py --directory work/distribution --source "$GITHUB_SHA" --extract work/verified-build
      - run: python3 scripts/native_pitr_acceptance.py --binary "$PWD/work/verified-build/wpalt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-pitr-evidence
          path: work/native-pitr-result.json
  reference-workload:
    if: github.event_name == 'pull_request' && github.head_ref == 'milestone/m7-resilient-operations'
    needs: clean-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wpalt-clean-linux-x86_64-${{ github.sha }}
          path: work/distribution
      - run: python3 scripts/release_build.py --directory work/distribution --source "$GITHUB_SHA" --extract work/verified-build
      - run: python3 scripts/matched_wordpress_benchmark.py --binary "$PWD/work/verified-build/wpalt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: m7-matched-reference
          path: work/m7-matched-reference.json
  migration-reference:
    if: github.event_name == 'pull_request' && github.head_ref == 'milestone/m8-migration-extensibility'
    needs: clean-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wpalt-clean-linux-x86_64-${{ github.sha }}
          path: work/distribution
      - run: python3 scripts/release_build.py --directory work/distribution --source "$GITHUB_SHA" --extract work/verified-build
      - run: python3 scripts/wordpress_migration_reference.py --binary "$PWD/work/verified-build/wpalt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: m8-wordpress-reference
          path: work/m8-wordpress-reference.json
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [application, compiler-floor, dependency-audit, clean-build, frontend, native-pitr]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wpalt-clean-linux-x86_64-${{ github.sha }}
          path: work/distribution
      - name: Publish verified dated development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_build.py --directory work/distribution --source "$GITHUB_SHA" --publish
