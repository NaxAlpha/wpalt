# CLI > WPALT_* environment variables > this TOML file > defaults.
# Run from the directory containing this file, or use absolute filesystem paths.
database_url = "sqlite://data/wpalt.db?mode=rwc"
data_dir = "data"
listen = "127.0.0.1:3000"
base_url = "http://127.0.0.1:3000"
debug = false
database_connections = 4
scheduler_seconds = 5
session_seconds = 28800
max_upload_bytes = 8388608
max_backup_bytes = 268435456
revision_retention = 50
request_concurrency = 32
worker_concurrency = 2
request_timeout_seconds = 30
# For PostgreSQL, prefer WPALT_DATABASE_URL so credentials stay out of version control.
# Non-local sites require an HTTPS base_url and a TLS reverse proxy.

# Disable the entire business platform to omit its public assets/routes/jobs.
business_enabled = true

# Local membership/learning; disabling it preserves access rules and fails closed.
membership_enabled = true
membership_max_records = 1000000

[mail]
enabled = true
from = "site@localhost.test"
max_attempts = 5
batch_size = 64
# No SMTP routes means a private local .eml outbox, not internet delivery.
# [[mail.smtp]]
# host = "127.0.0.1"
# port = 2525
# tls = "local" # Plain transport is restricted to explicit loopback IPs.
# username = ""
# password = "" # Supply production credentials outside version control.

[engagement]
enabled = true # Module availability; collection starts OFF in administration.
max_events = 100000
max_sessions = 10000
retention_days = 30
respect_dnt = true

[business_limits]
forms = 1000
entries = 100000
entry_bytes = 268435456
contacts = 100000
drafts = 10000
draft_bytes = 67108864
uploads = 10000
upload_bytes = 268435456
registrations = 10000
mail_jobs = 100000
mail_bytes = 268435456
mail_retention_days = 30

# Optional provider sign-in. Local accounts need none of these services.
[identity]
enabled = false
issuer = ""
client_id = ""
client_secret = "" # Prefer WPALT_IDENTITY_CLIENT_SECRET from a secret manager.
authorization_url = ""
token_url = ""
jwks_url = ""
ca_cert_file = "" # Optional public PEM root certificate for an owner-controlled private PKI; never a private key.
# Enabling requires an HTTPS base_url and explicit HTTPS provider endpoints.

# M6 owner-hosted commerce. Currency is immutable once the database is initialized.
[commerce]
enabled = true
currency = "USD" # USD/EUR/GBP use minor cents; JPY uses whole yen.
hold_seconds = 900 # 60..3600; hosted Checkout holds are at least 1800 seconds.
max_records = 1000000
referral_bps = 500 # 5%, from settled subtotal after discounts.

[commerce.stripe]
enabled = false
# Set WPALT_STRIPE_SECRET_KEY and WPALT_STRIPE_WEBHOOK_SECRET in the environment.
# Requires HTTPS base_url. Pin endpoint API version 2026-09-30.endive.
secret_key = ""
webhook_secret = ""
api_url = "" # Empty = https://api.stripe.com/v1. Explicit HTTPS overrides only.
ca_cert_file = "" # Optional private CA for owner/test infrastructure, <=32 KiB PEM.

# Scheduled authenticated encrypted recovery. Destinations must already exist;
# mounted independent storage is owner-managed. Do not put the key in them.
[recovery]
# Deduplicate encrypted chunks; keep sibling wpalt-objects with every retained package.
incremental = false
enabled = false
key_file = "/secure/wpalt-recovery.key"
destinations = ["/mnt/independent/wpalt-backups"]
interval_seconds = 86400
retain = 14

# Bounded anonymous listing/sitemap cache. Cookie/authenticated/private routes bypass.
[cache]
# Compression negotiation is applied to both fresh and cached responses.
gzip = true
# Mutable preview asset URLs: zero revalidates on every use; maximum 3600.
asset_cache_seconds = 0
enabled = false
max_bytes = 8388608
max_entries = 128
ttl_seconds = 60

# Local peer rules: no X-Forwarded-For trust; configure at the outer proxy too.
[protection]
enabled = false
denied_prefixes = []
denied_peers = []
requests_per_window = 300
window_seconds = 60
