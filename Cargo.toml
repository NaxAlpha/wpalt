[package]
name = "wpalt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Owner-controlled Rust publishing CMS"
publish = false

[dependencies]
anyhow = "1"
argon2 = "0.5"
ammonia = "4"
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
fs2 = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
maud = "0.27"
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
pulldown-cmark = "0.13"
rand = "0.8"
ring = "=0.17.14"
webauthn-rs = "=0.5.5"
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
hmac = "=0.12.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "sqlite", "postgres"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["compression-gzip", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
jsonwebtoken = { version = "9.3", default-features = false }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "avif"] }

[dev-dependencies]
flate2 = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Generated by scripts/prepare_encoder.py; pinned upstream maintenance patch.
[patch.crates-io]
rav1e = { path = "vendor/rav1e" }
